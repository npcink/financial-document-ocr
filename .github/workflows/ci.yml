name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check public-release data boundary
        run: ./scripts/check-public-readiness.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Test and compile backend
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest discover -s backend/tests -v
          python -m compileall -q backend/app backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and audit frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Validate Compose
        run: |
          cp backend/.env.example backend/.env
          docker compose config --quiet

      - name: Build Docker image
        run: docker build -f backend/Dockerfile .

      - name: Verify portable source backup
        run: |
          archive="$(./scripts/backup-source.sh "$RUNNER_TEMP/backup")"
          tar -tzf "$archive" > "$RUNNER_TEMP/archive-entries.txt"
          if grep -E '(^|/)(\.env$|data/|backups/|node_modules/|dist/|static/|\.sisyphus/)|\.db(-wal|-shm)?$|\.xlsx$' "$RUNNER_TEMP/archive-entries.txt"; then
            echo "Portable source archive contains a forbidden entry" >&2
            exit 1
          fi
